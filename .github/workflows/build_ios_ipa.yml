name: Build Unsigned iOS IPA (No-Mac Pipeline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AI_Memory_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Memory_Unsigned_IPA
          path: AI_Memory_Unsigned.ipa
          retention-days: 30
